  artifacts:
    - id: suspicious-login-alert
      systemId: alert_dashboard
      kind: alert
      title: Unfamiliar successful login
      summary: Alert A-1042 · high priority
      body: |
        Review purpose: reconstruct the sequence, then compare it with the account's usual activity.

        Alert A-1042 · sign-in monitoring · office-local record times
        07:38–07:40: Source IP 203.0.113.44 reported 6 failed MFA challenges.
        07:41: One successful password login for j.patel@example.com from the same source.
        MFA means an extra identity check beyond a password. This summary does not establish who completed the sign-in.

        Device label: unknown-laptop-17 · reported browser/platform: Chrome/Windows.
        Network: residential internet provider. Geo hint: Montreal metro.
        Location is an estimate associated with a network address, not verified travel or a person's identity.

        Keep the alert reference with your notes. A high-priority label asks for attention; it is not a finding of compromise.
      eventIds: [suspicious-login-1]
      relatedArtifactIds:
        [login-context-1, account-history-1, device-inventory-1]
      searchableText: unfamiliar login montreal failures MFA
      metadata:
        severity: high
        alertId: A-1042
    - id: login-context-1
      systemId: alert_dashboard
      kind: login_record
      title: Login context · j.patel
      summary: Device, network, and MFA context for the flagged session
      body: |
        Device name unknown-laptop-17. User agent Chrome/Windows. ASN residential ISP.
        No prior successful sessions from this ASN in 90 days. Travel calendar empty.

        Read alongside A-1042, not as a second independent confirmation of the same sign-in.
        A user agent is the browser and operating-system description a connection reports; it is not device ownership proof.
        ASN identifies a network operator; ISP means internet service provider. A residential network can have ordinary uses.

        The 90-day lookback covers successful sessions in this record, not every possible use of the account.
        An empty travel calendar means no entry is shown here. Compare account history and the employee's report before concluding why the pattern changed.
      eventIds: [suspicious-login-1]
      relatedArtifactIds: [suspicious-login-alert]
      searchableText: unknown laptop residential ISP
    - id: account-history-1
      systemId: alert_dashboard
      kind: account_history
      title: Account history · j.patel
      summary: Recent authentication pattern
      body: |
        Typical weekday logins from HQ Wi-Fi and enrolled MacBook.
        Two VPN sessions last week from Toronto office. No password resets in 30 days.

        Baseline means the repeated pattern used for comparison, not a guarantee that every different sign-in is unsafe.
        HQ is headquarters. An enrolled device is registered for organizational support and management.
        VPN is an organization-provided private connection; compare its use with the recorded context rather than treating the label as proof of safety.

        Keep the lookback limits in your notes: this is recent account history, not a complete record of the employee's movements or intentions.
      eventIds: [suspicious-login-1]
      searchableText: HQ Wi-Fi MacBook Toronto VPN
    - id: device-inventory-1
      systemId: knowledge_base
      kind: device_record
      title: Device inventory · j.patel
      summary: Enrolled devices for the account owner
      body: |
        Enrolled: corp-macbook-patel (active), corp-phone-patel (active).
        unknown-laptop-17 is not enrolled and has never checked into MDM.

        Account owner: J. Patel · lookup scope: organization-managed devices assigned to this account.
        corp-macbook-patel — corporate MacBook, active assignment.
        corp-phone-patel — corporate phone, active assignment.
        unknown-laptop-17 — exact identifier from the flagged session; no enrollment or check-in record in this inventory.

        MDM means mobile device management, the system used to register and manage work devices.
        A device label is not a person's identity. A missing record is a follow-up observation, not proof of who used the device.
        Preserve the exact identifier and the inventory result for the reviewer; do not substitute a similar device name.
      eventIds: [suspicious-login-1]
      searchableText: MDM enrolled macbook phone
      # Approved public lookup index; enrollment findings remain in the body.
      metadata:
        lookupKeys: unknown-laptop-17
    - id: handoff-email
      systemId: email
      kind: email
      title: Incomplete shift handoff
      summary: From night analyst · 07:55 · office local · inbox
      body: |
        Still watching the unfamiliar login thread. Did not finish device inventory check.
        A routine scanner alert may appear, but I forgot to include the approved schedule reference. Ping Morgan if the login expands.

        For the next analyst: A-1042 is the open sign-in item. The location estimate is only a lead; I have not confirmed who signed in.
        Please reply in the team channel with what you are picking up first, and leave a short next step in the ticket before switching tools.
        The scanner notice may be a delayed monitoring delivery. Compare the event time in that record with the approved window, not just the time it reaches our queue.

        Thanks for taking ownership. Keep anything I did not finish visible rather than assuming silence means it was checked.
      eventIds: [handoff-1]
      searchableText: handoff incomplete login routine
    - id: employee-login-reply
      systemId: email
      kind: email
      title: "Re: Was this login yours?"
      summary: From J. Patel · 08:05 · office local · reply
      body: |
        No. I am not traveling, and I did not use a Windows laptop this morning.
        My work MacBook and phone are both with me.

        I recognize those as my work devices, but I do not recognize the laptop name in your message.
        Please let me know the next step through our usual work channel. I have not shared a password or approval code in this reply.

        Analyst note: record this as the account owner's report. It adds context but does not independently identify the person behind the session.
      eventIds: [suspicious-login-1]
      searchableText: employee reply no travel windows laptop
    - id: scanner-alert
      systemId: alert_dashboard
      kind: alert
      title: Scanner connection alert
      summary: Alert A-1180 · low priority
      body: |
        Alert A-1180 · connection monitoring · delayed delivery to this shift
        Recorded activity: most recent completed Monday window, 10:18 office local; compare this event time, not the notification arrival time.
        Vulnerability scanner vuln-scan-03 opened connections across the finance VLAN during the published scanning window.

        A vulnerability scanner checks systems for weaknesses. VLAN means a separately managed network segment; here the target is the finance network.
        This alert summarizes connection activity, not confirmed exploitation or data access.
        Before closing, compare source, time, and target scope with the approved reference and leave that match in the ticket.
      eventIds: [routine-alert-1]
      relatedArtifactIds: [scanner-window]
      searchableText: vuln-scan finance VLAN
    - id: scanner-window
      systemId: knowledge_base
      kind: kb_document
      title: Approved scanner window
      summary: Change calendar · weekly
      body: |
        vuln-scan-03 is approved Mondays 10:00–12:00 for finance VLAN discovery.
        Close matching alerts after documenting the window reference.

        Reference: SCAN-FIN-MON · recurring maintenance entry · times are office local.
        Purpose: let the team distinguish scheduled discovery from unexplained connection activity.
        In scope: scanner vuln-scan-03, finance network, and the stated Monday window.
        Out of scope: a different source, a different network, or activity outside that window. Do not extend this approval to another alert just because it looks routine.

        Record the scanner, event time, target network, and reference in the closure note.
        Compare the alert's recorded event time even when monitoring delivers the notice later.
        If a detail does not match, keep the uncertainty visible and ask Morgan for procedural guidance.
      eventIds: [routine-alert-1]
      searchableText: approved scanner window finance
    - id: chat-morgan
      systemId: team_chat
      kind: chat_thread
      title: "#soc-day · Morgan"
      summary: Manager channel
      body: |
        Morgan · shift start: Welcome. Start with the handoff and tell me what you will own first. An unfinished check is useful information, not something to hide.

        Morgan · investigation guidance: Separate what a record shows from what you think it means. When asking for help, name the record, the mismatch, and the question you need answered. Do not paste passwords or approval codes.

        Morgan · handoff guidance: Keep verified evidence, uncertainty, and the next step distinct. A reviewer should be able to follow your note without guessing what you opened. I can guide the procedure, but your tools and records remain the basis for the decision.
      eventIds: [handoff-1, suspicious-login-1]
      searchableText: Morgan team chat guidance

    - id: ticket-suspicious-login
      systemId: ticket_queue
      kind: ticket
      title: "Ticket · unfamiliar login"
      summary: Investigation notes
      body: |
        Capture evidence, uncertainty, and the decision path before escalation or dismissal.

        Verified evidence: cite the alert and exact device record you checked. Keep the employee's account in their own terms.
        Uncertainty: distinguish the location estimate and working explanation from what is independently supported.
        Next step: name the review you are requesting and the question it should resolve.

        Investigation notes are your separate working draft. Save them before switching work; the structured summary records the selected findings for handoff.
        Do not include passwords, approval codes, or claims about the employee's intentions.
      eventIds: [suspicious-login-1]
      searchableText: ticket investigation notes
