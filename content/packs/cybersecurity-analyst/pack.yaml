  eventTemplates:
    suspicious_login:
      instanceId: suspicious-login-1
      title: Unfamiliar successful login
      summary: >
        Repeated failures were followed by a successful sign-in from an unfamiliar network.
      priority: high
      systemId: alert_dashboard
      triggerAt: 0
      deadlineMinutes: 180
      initialStatus: active
      prohibitedOutcomes:
        - invented_credentials
        - unrestricted_system_access
        - silent_safety_bypass
      managerGuidance: >
        I have not looked into this login yet. Show me what you checked and what still
        does not line up; I can help with process, but I cannot decide what happened from
        the alert alone.
      actionConditions:
        escalate_alert: [{ flag: b1_terminal, equals: escalate }]
        dismiss_alert: [{ flag: b1_terminal, equals: dismiss }]
      progression:
        kind: stages
        allowManager: true
        utilityActions: [update_ticket_notes, query_records]
        stages:
          - after: []
            offer: [review_alert]
          - after: [review_alert]
            offer: [inspect_login_context]
          - after: [review_alert, inspect_login_context]
            offer: [inspect_account_history, check_device_inventory]
            mode: all_remaining
          - after:
              - review_alert
              - inspect_login_context
              - inspect_account_history
              - check_device_inventory
            offer: [document_ticket]
          - after:
              - review_alert
              - inspect_login_context
              - inspect_account_history
              - check_device_inventory
              - document_ticket
            offer: [escalate_alert]
            alsoOffer: [dismiss_alert, search_knowledge_base]
      actionEffects:
        search_knowledge_base:
          setKbQueryFromFreeText: true
          observeArtifactIds: [login-follow-up-guide]
          consequence:
            escalateOnApply: false
            description: >
              You chose to review the procedure because more evidence may be needed.
              The login case remains open: no dismissal, containment, or identity finding
              follows from this check. Save the unanswered question, compare the available
              session and route records, and use Morgan for procedural help if the gap remains.
              The team still needs your documented decision; a procedure lookup does not complete the investigation.
        escalate_alert:
          resolve: true
          emitEventResolved: true
          resolution: >
            Escalated with saved session identifiers and the documented investigation record.
            Senior review will check the route, device, and coverage comparisons as available;
            identity misuse remains suspected, not proven.
          consequence:
            escalateOnApply: false
            description: >
              A senior analyst received the ticket with saved session identifiers and the
              documented investigation record. The remaining question is who controlled the
              flagged session, and whether containment is warranted. The reviewer will check
              any missing comparisons before deciding next steps.
              The 07:45 export has no file-access or mailbox activity, and the alert and
              context summarize one source; the reviewer must obtain fuller records to
              establish access. No containment or confirmed identity finding has been recorded by this escalation.
          callbacks:
            - id: b1-comparison-review
              decisionId: suspicious_login
              delayMinutes: 20
              when: [{ flag: b1_choice, equals: escalate-with-comparisons }]
              author: reviewer
              body: The route and device comparisons are attached. I can start with the unresolved session owner and containment question.
              acknowledgement: Senior review will follow this case.
              requiredAtCompletion: true
            - id: b1-identifier-review
              decisionId: suspicious_login
              delayMinutes: 20
              when: [{ flag: b1_choice, equals: escalate-identifiers-only }]
              author: reviewer
              body: I have the session identifiers. I still need to reconstruct the route and device comparisons before deciding next steps.
              acknowledgement: Senior review will follow this case.
              requiredAtCompletion: true
        review_alert:
          observeArtifactIds: [suspicious-login-alert]
          callbacks:
            - id: d2-priority-followup
              delayMinutes: 15
              when: [{ flag: d2_first_read, equals: priority-first }]
              author: morgan
              body: The queue label helped you triage; compare the location estimate with session records before using it as an explanation.
          hidden:
            cognitiveLoad: 1
        inspect_account_history:
          callbacks:
            - id: d3-city-route-followup
              delayMinutes: 15
              when: [{ flag: d3_vpn, equals: city-led }]
              author: reviewer
              body: The shared city is still an estimate. I need the flagged source and route identifier alongside the earlier VPN session.
        check_device_inventory:
          observeArtifactIds: [device-inventory-1, employee-login-reply]
          consequence:
            escalateOnApply: false
            description: J. Patel replied that they were not traveling and did not use a Windows laptop.
        dismiss_alert:
          resolve: true
          resolution: >
            Dismissed without an escalation review. Closing the queue item does not verify
            the session's owner or establish expected activity. A VPN explanation needs a
            matching session route, not just a city estimate; preserve any completed comparisons and unfinished checks.
          consequence:
            description: >
              The dismissed login alert needs renewed attention after related activity.
              The next analyst must recover the session identifiers from the saved notes,
              check whether a VPN route was actually matched, and separate the employee's
              report from the HR record's limited coverage. Completed checks remain useful;
              missing comparisons must be reconstructed. The new activity warrants review, not
              a claim that an attacker has been identified.
            delayMinutes: 40
            escalateOnApply: true
            escalateResolution: Related activity appeared after dismissal; reopen the review and reconstruct any missing checks from the records.
            requiredAtCompletion: true
          callbacks:
            - id: b1-location-followup
              decisionId: suspicious_login
              delayMinutes: 20
              when: [{ flag: b1_choice, equals: close-location-explained }]
              author: reviewer
              body: The city estimate is not a verified route. I will recheck the saved session comparison before accepting this closure.
              acknowledgement: Later review will follow this case.
              requiredAtCompletion: true
              emitEvent: login_clarification
            - id: b1-familiar-followup
              decisionId: suspicious_login
              delayMinutes: 20
              when: [{ flag: b1_choice, equals: close-familiar-account }]
              author: employee
              body: "It’s my account, but I don’t recognize that laptop. What happens next?"
              acknowledgement: Later review will follow this case.
              requiredAtCompletion: true
              emitEvent: login_clarification
          hidden:
            riskExposure: 1

    incomplete_handoff:
      instanceId: handoff-1
      title: Shift handoff
      summary: The previous analyst left an incomplete note about open monitoring work.
      priority: normal
      systemId: email
      triggerAt: 0
      deadlineMinutes: 35
      initialStatus: active
      managerGuidance: >
