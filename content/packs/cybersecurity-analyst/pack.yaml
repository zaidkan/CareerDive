      kind: ticket
      title: Ticket · Rivera login prompts
      summary: Troubleshooting note
      body: |
        Record the device-specific results, the ordinary explanation being tested, and the condition for reopening.
        No access-role change is requested or supported by these records.
      eventIds: [login-help-1]
      relatedArtifactIds: [rivera-auth-summary, login-troubleshooting-guide]
      searchableText: Rivera login troubleshooting ticket
