      progression:
        kind: linear
        allowManager: true
        sequence: [read_handoff, acknowledge_handoff]

    access_request:
      instanceId: access-request-1
      title: Urgent finance access request
      summary: A coworker needs temporary reporting access and cites an approved deadline.
      priority: normal
      systemId: email
      triggerAt: 20
      deadlineMinutes: 180
      initialStatus: pending
      managerGuidance: >
        Confirm the resource, requested duration, and approval owner. I can help with
        process, but I cannot replace the finance data owner's authorization. Urgency
        is context, not permission.
      progression:
        kind: linear
        allowManager: true
        sequence: [route_access_request]
      actionEffects:
        route_access_request:
          resolve: true
          resolution: The request was routed to the finance data owner; approval is pending and no access has been granted.
          emitEventResolved: true
          consequence:
            escalateOnApply: false
            description: The selected access response and its authority boundary remain in the shift record for follow-up.
          callbacks:
            - id: b2-owner-response
              decisionId: finance_access
              delayMinutes: 15
              when: [{ flag: b2_choice, equals: route-to-owner }]
              author: reviewer
              body: I received the request and will verify the finance role approval. Access remains pending.
              acknowledgement: An owner response will follow.
              requiredAtCompletion: true
            - id: b2-interim-response
              decisionId: finance_access
              delayMinutes: 15
              when: [{ flag: b2_choice, equals: route-with-interim }]
              author: reviewer
              body: The interim report can help the project while I review the requested role. No new access has been granted.
              acknowledgement: An owner response will follow.
              requiredAtCompletion: true
            - id: b2-self-response
              decisionId: finance_access
              delayMinutes: 15
              when: [{ flag: b2_choice, equals: self-approve }]
              author: reviewer
              body: I found access granted before owner authorization. I am reviewing the grant and the business request separately.
              acknowledgement: An owner response will follow.
              requiredAtCompletion: true
            - id: b2-reject-response
              decisionId: finance_access
              delayMinutes: 15
              when: [{ flag: b2_choice, equals: reject-as-attack }]
              author: employee
              body: This is a real project request. Who can review the access need now that it was rejected?
              acknowledgement: A request response will follow.
              requiredAtCompletion: true
          hidden:
            taskBacklog: -1

    routine_alert_review:
      instanceId: routine-alert-1
      title: Scanner connection alert review
      summary: A vulnerability scanner generated a connection alert during a possible approved window; the match is not yet checked.
      priority: low
      systemId: alert_dashboard
      triggerAt: 25
      deadlineMinutes: 220
      initialStatus: pending
      managerGuidance: >
        Check the scanner, target network, and event time against the approved window.
        If they don’t match, leave the mismatch open.
      progression:
        kind: linear
        allowManager: true
        utilityActions: [update_ticket_notes]
        sequence:
          - review_alert
          - search_knowledge_base
          - document_ticket
          - dismiss_alert
      actionEffects:
        document_ticket:
          setTicketNotesFromFreeText: true
          callbacks:
            - id: d6-monitoring-note
              delayMinutes: 12
              when: [{ flag: d6_scanner, equals: close-and-monitor }]
              author: morgan
              body: The expected connection alert can close on its matched run; routine monitoring remains separate.
        search_knowledge_base:
          setKbQueryFromFreeText: true
          observeArtifactIds: [scanner-window]
        review_alert:
          observeArtifactIds: [scanner-alert]
          hidden:
            cognitiveLoad: 1
        dismiss_alert:
          resolve: true
          resolution: A-1180 matched RUN-FIN-031 and SCAN-FIN-MON; documented and closed as expected discovery connections, not a finding that every system is secure.
          consequence:
            escalateOnApply: false
            description: >
              The reviewed routine alert was documented and closed as expected activity.
              Alert A-1180 is linked to RUN-FIN-031 and approved reference SCAN-FIN-MON.
              Recorded Monday 10:18 activity fits the run and window; delivery to this shift
              does not change that event time. The closure concerns expected discovery
              connections, not vulnerability findings or a claim that every system is secure. Check the queue
              for remaining work; any recorded login escalation still awaits senior review.
          hidden:
            taskBacklog: -1

    employee_login_help:
      instanceId: login-help-1
      title: Employee cannot stay signed in
      summary: A coworker reports repeated password prompts on a managed phone while their laptop still works.
      priority: normal
      systemId: email
      triggerAt: 45
      deadlineMinutes: 240
      initialStatus: pending
      managerGuidance: >
        Compare the devices and results before deciding what the failures mean. A known
        device retrying an old saved password is an ordinary possibility; keep monitoring
        if the retries continue after the employee updates it.
      progression:
        kind: linear
        allowManager: true
        sequence: [resolve_login_help]
      actionEffects:
        resolve_login_help:
          resolve: true
          resolution: The phone app's saved password was updated; the employee confirmed sign-in works and monitoring shows no further retries in this bounded check.
          emitEventResolved: true
          consequence:
            escalateOnApply: false
            description: A. Rivera confirmed the phone mail app had kept the old saved password. Updating it stopped the retries; the ticket preserves the device-specific evidence and the condition for reopening.
          callbacks:
            - id: d8-report-followup
              delayMinutes: 12
              when: [{ flag: d8_login_help, equals: employee-report }]
              author: employee
              body: My laptop sign-in still works. The phone retry stopped after I updated its saved password.
          hidden:
            accuracy: 1
            taskBacklog: -1

    morgan_status_check:
      instanceId: status-check-1
      title: Morgan's mid-shift check-in
      summary: Morgan asks for confirmed facts, remaining uncertainty, and the next action.
      priority: normal
      systemId: team_chat
      triggerAt: 65
      deadlineMinutes: 260
      initialStatus: pending
      managerGuidance: >
        Use three short parts: what a record confirms, what it cannot establish, and the
        next action you own. I will not decide the case from a status message.
      progression:
        kind: linear
        allowManager: false
        sequence: [send_status_update]
      actionEffects:
        send_status_update:
          resolve: true
          resolution: Morgan received a bounded update separating facts, uncertainty, and next work.
          emitEventResolved: true
          consequence:
            escalateOnApply: false
            description: Morgan confirmed the update is actionable and asked you to finish the ticket before requesting senior review.
          callbacks:
            - id: d9-source-status-note
              delayMinutes: 12
              when: [{ flag: d9_status, equals: source-only }]
              author: morgan
              body: Source noted. Add the failed-then-successful sequence when you prepare the reviewer handoff.
          hidden:
            taskBacklog: -1

    end_shift_handoff:
      instanceId: shift-handoff-1
      title: End-of-shift continuity
      summary: Leave the next analyst completed checks, open uncertainty, and the next owner.
      priority: normal
      systemId: team_chat
      triggerAt: 90
      deadlineMinutes: 320
      initialStatus: pending
      managerGuidance: >
        A strong handoff does not pretend every question is closed. Preserve the source
        references, say what remains under review, and name who should act next.
      progression:
        kind: linear
        allowManager: false
        sequence: [submit_shift_handoff]
      actionEffects:
        submit_shift_handoff:
          resolve: true
          resolution: The handoff was sent with its recorded checks, uncertainty, and next-owner detail.
          emitEventResolved: true
          consequence:
            escalateOnApply: false
            description: The next analyst received the handoff; any omitted references or corrections remain visible in its history.
          callbacks:
            - id: b3-complete-receipt
              decisionId: shift_handoff
              delayMinutes: 10
              when: [{ flag: b3_choice, equals: complete }]
              author: reviewer
              body: The check references and next owner are clear. I can continue from the saved work.
              acknowledgement: Handoff response will follow.
              requiredAtCompletion: true
            - id: b3-corrected-receipt
              decisionId: shift_handoff
              delayMinutes: 10
              when: [{ flag: b3_choice, equals: corrected }]
              author: reviewer
              body: I can see the corrected references and the earlier omission. I will use the corrected handoff.
              acknowledgement: Handoff response will follow.
              requiredAtCompletion: true
            - id: b3-thin-receipt
              decisionId: shift_handoff
              delayMinutes: 10
              when: [{ flag: b3_choice, equals: thin }]
              author: reviewer
              body: I have the handoff, but I need to recover the omitted check references before continuing.
              acknowledgement: Handoff response will follow.
              requiredAtCompletion: true
          hidden:
            taskBacklog: -1

