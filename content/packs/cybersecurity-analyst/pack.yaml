    - id: login-troubleshooting-guide
      systemId: knowledge_base
      kind: kb_document
      title: Repeated prompts after a password change
      summary: Beginner troubleshooting and escalation boundary
      body: |
        A working sign-in on one known device plus repeated retries from another known device can indicate a stale saved password.
        Ask the employee to update the saved password in the affected approved app, then check whether retries stop. Escalate if retries continue, an unknown device appears, or the employee reports activity they did not perform.

        Failed attempts do not identify an attacker. Record the device labels, results, time range, and what would cause the ticket to reopen.
      eventIds: [login-help-1]
      relatedArtifactIds: [rivera-login-email, rivera-auth-summary]
      searchableText: password change stale saved password retries
