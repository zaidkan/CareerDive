career:
  id: cybersecurity_analyst
  title: Junior Cybersecurity Analyst
  packVersion: 1.0.0
  reviewStatus: approved
  lastReviewed: 2026-06-01
  nextReview: 2027-06-01
  reviewingRoles:
    - practitioner
    - accessibility
    - bias
  sources:
    - title: U.S. Bureau of Labor Statistics Occupational Outlook Handbook
      url: https://www.bls.gov/ooh/computer-and-information-technology/information-security-analysts.htm
    - title: NIST NICE Workforce Framework for Cybersecurity
      url: https://www.nist.gov/itl/applied-cybersecurity/nice/nice-framework-resource-center
  rhythms:
    - routine_monitoring
    - quiet_investigation
  systems:
    - alert_dashboard
    - ticket_queue
    - email
    - knowledge_base
    - team_chat
  events:
    - suspicious_login
    - false_positive
    - phishing_report
    - incomplete_handoff
    - routine_alert_review
  rhythmBiasReview:
    ordinaryWorkRepresented: true
    calmWorkRepresented: true
    technicalAndRelationalWorkRepresented: true

scenario:
  location: operations_center
  manager: Morgan
  maxAiCostUsd: 0.05
  eventTemplates:
    suspicious_login:
      triggerAt: 0
      deadlineMinutes: 180
      availableActions:
        - review_alert
        - inspect_login_context
        - inspect_account_history
        - check_device_inventory
        - dismiss_alert
        - escalate_alert
        - document_ticket
        - ask_manager
      prohibitedOutcomes:
        - invented_credentials
        - unrestricted_system_access
        - silent_safety_bypass
    false_positive:
      triggerAt: 100
      deadlineMinutes: 300
      availableActions:
        - review_alert
        - inspect_login_context
        - document_ticket
        - dismiss_alert
    phishing_report:
      triggerAt: 55
      deadlineMinutes: 260
      availableActions:
        - open_phishing_report
        - inspect_email_headers
        - check_link_destination
        - quarantine_message
        - notify_reporter
        - document_ticket
    incomplete_handoff:
      triggerAt: 0
      deadlineMinutes: 35
      availableActions:
        - read_handoff
        - acknowledge_handoff
        - ask_manager
    routine_alert_review:
      triggerAt: 25
      deadlineMinutes: 220
      availableActions:
        - review_alert
        - search_knowledge_base
        - document_ticket
        - dismiss_alert
