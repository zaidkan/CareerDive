career:
  id: cybersecurity_analyst
  title: Junior Cybersecurity Analyst
  packVersion: 2.0.0
  reviewStatus: approved
  lastReviewed: 2026-06-01
  nextReview: 2027-06-01
  reviewingRoles:
    - practitioner
    - accessibility
    - bias
  sources:
    - title: U.S. Bureau of Labor Statistics Occupational Outlook Handbook
      url: https://www.bls.gov/ooh/computer-and-information-technology/information-security-analysts.htm
    - title: NIST NICE Workforce Framework for Cybersecurity
      url: https://www.nist.gov/itl/applied-cybersecurity/nice/nice-framework-source-center
  rhythms:
    - routine_monitoring
    - quiet_investigation
  systems:
    - alert_dashboard
    - ticket_queue
    - email
    - knowledge_base
    - team_chat
  events:
    - incomplete_handoff
    - suspicious_login
    - access_request
    - routine_alert_review
    - employee_login_help
    - morgan_status_check
    - end_shift_handoff
  rhythmBiasReview:
    ordinaryWorkRepresented: true
    calmWorkRepresented: true
    technicalAndRelationalWorkRepresented: true

scenario:
  location:
    id: operations-center
    name: Security Operations Center
    connectedLocationIds: []
    interactableIds:
      - alert-dashboard
      - ticket-queue
      - email
      - knowledge-base
      - team-chat
  maxAiCostUsd: 0.05
  briefing: >
    Morning. The previous analyst left a handoff in your inbox, and a suspicious
    login needs review. Work will also arrive from coworkers and routine monitoring.
    Read what is available, keep uncertainty visible, follow approval boundaries,
    and leave the next analyst enough context to continue.
  initialTaskBacklog: 7
  workplaceDefaults:
    energyMax: 100
    fridgeSnackBars: 2
    snackBitesPerBar: 3
    coffeeServings: 2
  tasks:
    - id: handoff-open-items
      eventTemplateId: incomplete_handoff
      actionId: read_handoff
      systemId: email
      kind: select_clues
      title: Find what the last analyst left open
      whyItMatters: A handoff stops unfinished work from disappearing between shifts.
      releasesActionGate: true
      steps:
        - id: unfinished-check
          title: Find the unfinished investigation step
          prompt: Carry the unfinished work into your shift notes so it has an owner.
          instruction: Mark the passage describing a check that is still open.
          relatedArtifactIds: [handoff-email]
          minSelections: 1
          maxSelections: 1
          options:
            - id: device-check
              label: The unfamiliar device was not checked in inventory
              source:
                {
                  artifactId: handoff-email,
                  quote: "Did not finish device inventory check.",
                }
            - id: manager-online
              label: Contact Morgan if the login expands
              source:
                {
                  artifactId: handoff-email,
                  quote: "Ping Morgan if the login expands.",
                }
            - id: login-watched
              label: The login alert is being watched
              source:
                {
                  artifactId: handoff-email,
                  quote: "Still watching the unfamiliar login thread.",
                }
          requiredOptionIds: [device-check]
          coachOnFailure: Look for wording that says a check was not finished.
          successText: You found the unfinished device check.
        - id: missing-reference
          title: Spot the missing routine-work detail
          prompt: Identify the missing reference you will need before closing routine work.
          instruction: Mark the passage about information the next analyst still needs.
          relatedArtifactIds: [handoff-email]
          minSelections: 1
          maxSelections: 1
          options:
            - id: scanner-window
              label: The approved scanner schedule
              source:
                {
                  artifactId: handoff-email,
                  quote: "A routine scanner alert may appear, but I forgot to include the approved schedule reference.",
                }
            - id: employee-password
              label: The login thread is still being watched
              source:
                {
                  artifactId: handoff-email,
                  quote: "Still watching the unfamiliar login thread.",
                }
            - id: alert-color
              label: Contact Morgan if the login expands
              source:
                {
                  artifactId: handoff-email,
                  quote: "Ping Morgan if the login expands.",
                }
          requiredOptionIds: [scanner-window]
          coachOnFailure: Routine alerts need a trusted schedule or procedure before closure.
          successText: You noticed that the scanner schedule reference is missing.

    - id: handoff-priority-message
      eventTemplateId: incomplete_handoff
      actionId: acknowledge_handoff
      systemId: team_chat
      kind: choose_response
      title: Tell Morgan your starting plan
      whyItMatters: Analysts name their priority so teammates know what is covered.
      releasesActionGate: true
      steps:
        - id: choose-priority
          title: Choose a clear handoff reply
          prompt: Send Morgan a starting plan that names your priority and the work you will keep watching.
          instruction: Send a reply that makes your ownership and priority clear.
          relatedArtifactIds: [handoff-email, chat-morgan]
          minSelections: 1
          maxSelections: 1
          options:
            - id: login-first-watch-routine
              label: I will investigate the unfamiliar login first and watch for the routine scanner alert.
            - id: routine-first-watch-login
              label: I will check the scanner reference first and keep the unfamiliar login open for immediate follow-up.
            - id: close-everything
              label: I will close both alerts now because the last analyst mentioned them.
            - id: manager-does-it
              label: Please take both items while I wait for more instructions.
          requiredOptionIds: [login-first-watch-routine]
          outcomes:
            - id: login-first-watch-routine
              selectedOptionIds: [login-first-watch-routine]
              setFlags: { d1_triage: login-first }
              feedback: Morgan has your starting order.
            - id: routine-first-watch-login
              selectedOptionIds: [routine-first-watch-login]
              setFlags: { d1_triage: routine-first }
              feedback: Morgan has your starting order; the login still needs prompt follow-up.
          coachOnFailure: Keep ownership, start with higher risk, and leave routine work open until checked.
          successText: Morgan knows your priority and what you are watching next.

    - id: login-alert-compare
      eventTemplateId: suspicious_login
      actionId: review_alert
      systemId: alert_dashboard
      kind: compare_records
      title: Read the alert signal
      whyItMatters: One detail rarely proves anything. Analysts combine signals before deciding.
      releasesActionGate: true
      steps:
        - id: alert-sequence
          title: Reconstruct what happened
          prompt: Reconstruct the sign-in sequence before deciding what needs investigation.
          instruction: Select the event sequence shown in the alert.
          relatedArtifactIds: [suspicious-login-alert]
          minSelections: 1
          maxSelections: 1
          options:
            - id: failures-then-success
              label: Six failed checks, then one successful login
            - id: one-normal-login
              label: One normal login from headquarters
            - id: password-reset
              label: A password reset followed by no login
          requiredOptionIds: [failures-then-success]
          coachOnFailure: Read the order of events, not only the location.
          successText: You identified the unusual failed-then-successful sequence.
        - id: alert-uncertainty
          title: Separate signal from proof
          prompt: Keep estimates separate from confirmed observations in your notes.
          instruction: Mark the detail that needs another source of context.
          relatedArtifactIds: [suspicious-login-alert]
          minSelections: 1
          maxSelections: 1
          options:
            - id: geo-hint
              label: The Montreal location hint
              detail: Location estimates can be incomplete or wrong.
            - id: alert-id
              label: The alert number A-1042
            - id: priority-label
              label: The dashboard says high priority
          requiredOptionIds: [geo-hint]
          outcomes:
            - id: geo-hint
              selectedOptionIds: [geo-hint]
              setFlags: { d2_first_read: location-limit }
              feedback: You marked the location estimate as uncertain.
            - id: priority-label
              selectedOptionIds: [priority-label]
              setFlags: { d2_first_read: priority-first }
              feedback: You started with priority; the location estimate still needs another source.
          coachOnFailure: Find the clue that is useful but not reliable enough by itself.
          successText: You kept the location as a clue instead of treating it as proof.

    - id: login-context-clues
      eventTemplateId: suspicious_login
      actionId: inspect_login_context
      systemId: alert_dashboard
      kind: select_clues
      title: Find the strongest context clues
      whyItMatters: Device and network context help analysts judge whether a login fits normal use.
      releasesActionGate: true
      steps:
        - id: context-clues
          title: Mark details that need follow-up
          prompt: Compare this session with the account's known activity to plan your follow-up.
          instruction: Mark the device and network observations that need checking.
          relatedArtifactIds: [login-context-1, suspicious-login-alert]
          minSelections: 2
          maxSelections: 2
          options:
            - id: unknown-windows-device
              label: The session used unknown-laptop-17 with Windows
            - id: new-residential-network
              label: No successful login from this residential network appeared in 90 days
            - id: chrome-browser
              label: The browser was Chrome
            - id: morning-time
              label: The event happened in the morning
          requiredOptionIds: [unknown-windows-device, new-residential-network]
          coachOnFailure: Compare what is new for this account, not what is common for many users.
          successText: You isolated the new device and network as follow-up clues.

    - id: account-pattern-compare
      eventTemplateId: suspicious_login
      actionId: inspect_account_history
      systemId: alert_dashboard
      kind: compare_records
      title: Compare the account's normal pattern
      whyItMatters: A baseline is the account's usual pattern. It makes unusual activity easier to see.
      releasesActionGate: true
      steps:
        - id: usual-pattern
          title: Build the normal baseline
          prompt: Establish the account's usual sign-in pattern before comparing the flagged session.
          instruction: Open both records and mark the passages describing usual activity.
          relatedArtifactIds: [account-history-1, login-context-1]
          minSelections: 2
          maxSelections: 2
          options:
            - id: hq-wifi
              label: Headquarters Wi-Fi
              source: { artifactId: account-history-1, quote: "HQ Wi-Fi" }
              term: HQ
              termHelp: Headquarters — the organization's main office.
            - id: enrolled-macbook
              label: An enrolled MacBook
              source:
                { artifactId: account-history-1, quote: "enrolled MacBook" }
              term: Enrolled
              termHelp: Registered with the organization so its support team can manage it.
            - id: unknown-windows
              label: An unknown Windows laptop
              source:
                {
                  artifactId: login-context-1,
                  quote: "Device name unknown-laptop-17. User agent Chrome/Windows.",
                }
            - id: residential-asn
              label: A residential internet provider
              source:
                { artifactId: login-context-1, quote: "ASN residential ISP." }
              term: ASN / ISP
              termHelp: Labels for the network and internet provider used by a connection. A home provider alone does not prove a problem.
          requiredOptionIds: [hq-wifi, enrolled-macbook]
          coachOnFailure: Use the history record to find repeated, known behavior.
          successText: You built a useful baseline from the account history.
        - id: difference
          title: State the meaningful difference
          prompt: Write a comparison that another analyst could check against these records.
          instruction: Keep both records in view. Compare the device and network, then choose a cautious conclusion.
          relatedArtifactIds: [account-history-1, login-context-1]
          minSelections: 1
          maxSelections: 1
          options:
            - id: device-and-network-differ
              label: Both the device and network differ from the usual pattern.
            - id: browser-proves-attack
              label: The browser alone is enough to classify this session as misuse.
            - id: city-matches-office
              label: Montreal matches the Toronto office pattern.
          requiredOptionIds: [device-and-network-differ]
          coachOnFailure: Compare device and network facts without claiming they prove an attack.
          successText: You explained the difference without overstating the evidence.
        - id: vpn-cross-check
          title: Test the VPN explanation
          prompt: Check whether the known private connection explains the flagged session, using session identifiers and route records together.
          instruction: Carry the earlier session's route, the approved exit address, and the flagged session's source into your comparison.
          relatedArtifactIds:
            [prior-session-1, vpn-context-1, login-session-timeline]
          minSelections: 3
          maxSelections: 3
          options:
            - id: baseline-vpn-route
              label: Earlier session route
              source:
                {
                  artifactId: prior-session-1,
                  quote: "S-0731 used corp-macbook-patel through VPN connection V-218, exiting at 198.51.100.20.",
                }
            - id: approved-vpn-exit
              label: Approved route record
              source:
                {
                  artifactId: vpn-context-1,
                  quote: "V-218 maps to exit 198.51.100.20; this office's only approved VPN exit in this snapshot.",
                }
            - id: flagged-direct-route
              label: Flagged session source
              source:
                {
                  artifactId: login-session-timeline,
                  quote: "S-0741: source 203.0.113.44; VPN connection ID absent; device label unknown-laptop-17.",
                }
            - id: vpn-display-city
              label: Earlier session city estimate
              source:
                {
                  artifactId: prior-session-1,
                  quote: "Displayed city: Montreal (network estimate).",
                }
          requiredOptionIds:
            [baseline-vpn-route, approved-vpn-exit, flagged-direct-route]
          outcomes:
            - id: route-compared
              selectedOptionIds: [baseline-vpn-route, approved-vpn-exit, flagged-direct-route]
              setFlags: { d3_vpn: route-compared }
              feedback: Route comparison saved with the flagged source.
            - id: city-led
              selectedOptionIds: [baseline-vpn-route, approved-vpn-exit, vpn-display-city]
              setFlags: { d3_vpn: city-led }
              feedback: City-led comparison saved; the flagged session source still needs a direct match.
          coachOnFailure: Compare the route identifiers and addresses across all three records. A shared city estimate does not link two sessions to the same private connection.
          successText: You preserved the route comparison. The shared city estimate does not explain the different source; missing route data still limits certainty.

    - id: device-owner-match
      eventTemplateId: suspicious_login
      actionId: check_device_inventory
      systemId: knowledge_base
      kind: match_reference
      title: Match the device to inventory
      whyItMatters: Inventory shows which devices the organization recognizes and manages.
      releasesActionGate: true
      steps:
        - id: inventory-match
          title: Check device ownership
          prompt: Review the exact unknown-laptop-17 record and capture its enrollment status.
          instruction: Match the alert device to the inventory record.
          relatedArtifactIds: [device-inventory-1, login-context-1]
          minSelections: 1
          maxSelections: 1
          options:
            - id: not-enrolled
              label: It is not enrolled and has never checked in
            - id: assigned-macbook
              label: It is J. Patel's assigned corporate MacBook
            - id: assigned-phone
              label: It is J. Patel's corporate phone
          requiredOptionIds: [not-enrolled]
          coachOnFailure: Match the exact device name, not only the employee name.
          successText: You confirmed the alert came from an unmanaged device.
        - id: owner-reply
          title: Use the employee's reply
          prompt: Add the account owner's report to your investigation without treating it as independent proof.
          instruction: Select what the employee confirmed.
          relatedArtifactIds: [employee-login-reply]
          minSelections: 1
          maxSelections: 1
          options:
            - id: denied-login
              label: J. Patel was not traveling and did not use a Windows laptop
            - id: forgot-password
              label: J. Patel forgot the account password
            - id: approved-device
              label: J. Patel approved unknown-laptop-17
          requiredOptionIds: [denied-login]
          coachOnFailure: Read the reply for what the account owner directly confirmed.
          successText: You added the account owner's denial to the evidence.
        - id: travel-record-limits
          title: Check what the travel record can establish
          prompt: Compare the employee's account with the administrative travel record before writing a conclusion about location.
          instruction: Preserve the employee's report and the coverage limit of the travel record.
          relatedArtifactIds: [employee-login-reply, travel-status-1]
          minSelections: 2
          maxSelections: 2
          options:
            - id: reported-no-travel
              label: Employee account
              source:
                {
                  artifactId: employee-login-reply,
                  quote: "No. I am not traveling, and I did not use a Windows laptop this morning.",
                }
            - id: travel-coverage-limit
              label: Administrative record coverage
              source:
                {
                  artifactId: travel-status-1,
                  quote: "This register covers approved work trips only; it does not record personal travel, live location, or requests awaiting approval.",
                }
            - id: office-assignment
              label: Assigned office
              source:
                {
                  artifactId: travel-status-1,
                  quote: "Assigned office: Toronto.",
                }
          requiredOptionIds: [reported-no-travel, travel-coverage-limit]
          coachOnFailure: An assigned office is not a live location. Compare the employee's report with what the register includes and leaves out.
          successText: You kept reported activity separate from administrative coverage; neither record identifies who used the session.

    - id: login-ticket-summary
      eventTemplateId: suspicious_login
      actionId: document_ticket
      systemId: ticket_queue
      kind: build_summary
      title: Build an investigation note
      whyItMatters: Clear notes let the next analyst repeat your comparisons, identify missing evidence, and request a bounded review without guessing what you checked.
      steps:
        - id: summary-evidence
          title: Choose evidence
          prompt: Record the sign-in sequence and device check so a reviewer can trace your reasoning.
          instruction: Add verified observations from the records you opened.
          relatedArtifactIds: [suspicious-login-alert, device-inventory-1]
          minSelections: 2
          maxSelections: 2
          options:
            - id: failed-then-success
              label: A-1042 / S-0741 — Six failed challenges were followed by a successful login; the timeline does not record a successful extra identity check.
            - id: unmanaged-device
              label: Inventory lookup — unknown-laptop-17 is not enrolled; no managed-device check-in was found for that exact label.
            - id: definite-attacker
              label: Account takeover is confirmed from the alert alone
            - id: montreal-proof
              label: The city estimate is enough to confirm misuse
          requiredOptionIds: [failed-then-success, unmanaged-device]
          coachOnFailure: More evidence is needed to support this note. Reopen the records and compare the observations with your wording; the ticket remains at this step and no decision has been applied.
          successText: Your note now contains two verified facts.
        - id: summary-uncertainty
          title: Record uncertainty and confirmation
          prompt: Record the employee response with appropriate uncertainty.
          instruction: Separate the employee's report from what remains unverified.
          relatedArtifactIds: [employee-login-reply]
          minSelections: 1
          maxSelections: 1
          options:
            - id: employee-denial
              label: J. Patel reports no travel and no use of a Windows laptop; HR lists approved work trips only, so identity misuse is suspected, not yet proven.
            - id: employee-proves-attacker
              label: The employee reply identifies the person who signed in.
            - id: ignore-reply
              label: Omit the employee reply until another record confirms it.
          requiredOptionIds: [employee-denial]
          coachOnFailure: The note needs a clearer boundary between the employee report and your conclusion. Review the opened reply; this attempt has not closed or escalated the alert.
          successText: Your note separates confirmed information from the working conclusion.
        - id: summary-route-comparison
          title: Preserve the alternative explanation
          prompt: Leave the next analyst a traceable comparison of the VPN explanation and its limits.
          instruction: Include the session references, route mismatch, and remaining uncertainty.
          relatedArtifactIds:
            [
              prior-session-1,
              vpn-context-1,
              login-session-timeline,
              travel-status-1,
            ]
          minSelections: 1
          maxSelections: 1
          options:
            - id: route-mismatch-with-limits
              label: S-0731 matches VPN V-218 at 198.51.100.20; S-0741 uses 203.0.113.44 without a VPN connection ID. The shared Montreal estimate does not establish a shared route, and absent route data does not identify the user.
            - id: shared-city-explanation
              label: S-0731 and S-0741 both show Montreal, so carry the earlier VPN explanation forward to this session.
            - id: travel-register-explanation
              label: HR shows no approved trip, so record Toronto as the verified physical location of the flagged session.
          requiredOptionIds: [route-mismatch-with-limits]
          coachOnFailure: Compare the session and connection identifiers, then check the HR record's coverage. Preserve the explanation you tested without turning a missing field into proof.
          successText: The ticket now carries the competing explanation and the records that limit it.
        - id: summary-collection-limits
          title: State what the records cannot show
          prompt: Preserve the collection boundary so the reviewer can identify evidence still needed.
          instruction: Select the coverage limit and the warning about repeated summaries of one source.
          relatedArtifactIds: [login-session-timeline]
          minSelections: 2
          maxSelections: 2
          options:
            - id: collection-coverage-limit
              label: The export ends at 07:45 and has no file-access or mailbox activity; what was accessed remains unverified.
              source:
                artifactId: login-session-timeline
                quote: "Limit: collection ends 07:45; no file/mail activity collected. A-1042 and login-context-1 summarize this same source, not independent corroboration."
            - id: shared-source-limit
              label: A-1042 and login-context-1 summarize the same source, so they are not independent confirmations.
              source:
                artifactId: login-session-timeline
                quote: "Limit: collection ends 07:45; no file/mail activity collected. A-1042 and login-context-1 summarize this same source, not independent corroboration."
            - id: session-refresh-only
              label: Include only the later session refresh.
              source:
                artifactId: login-session-timeline
                quote: "Limit: collection ends 07:45; no file/mail activity collected. A-1042 and login-context-1 summarize this same source, not independent corroboration."
          requiredOptionIds: [collection-coverage-limit, shared-source-limit]
          coachOnFailure: A session refresh describes activity, but not the export's coverage. Find what was not collected and which summaries share a source; missing activity records do not prove nothing was accessed.
          successText: Your handoff now states the collection gap without claiming a data-access outcome.
        - id: summary-next-step
          title: Add the next step
          prompt: Add a reversible professional next step to the ticket.
          instruction: Give the reviewer a bounded next step and preserve the evidence.
          relatedArtifactIds: [ticket-suspicious-login]
          minSelections: 1
          maxSelections: 1
          options:
            - id: escalate-with-comparisons
              label: Escalate with the route, device, and coverage comparisons attached.
            - id: escalate-identifiers-only
              label: Escalate with the session identifiers and remaining questions.
            - id: close-location-explained
              label: Close using the location explanation and preserve the comparisons.
            - id: close-familiar-account
              label: Close based on the familiar account while preserving the unresolved session owner.
          requiredOptionIds: [escalate-with-comparisons]
          outcomes:
            - id: escalate-with-comparisons
              selectedOptionIds: [escalate-with-comparisons]
              setFlags: { b1_choice: escalate-with-comparisons, b1_terminal: escalate }
              feedback: Disposition recorded. Senior review can use the saved comparisons.
            - id: escalate-identifiers-only
              selectedOptionIds: [escalate-identifiers-only]
              setFlags: { b1_choice: escalate-identifiers-only, b1_terminal: escalate }
              feedback: Disposition recorded. Senior review will need to reconstruct the comparisons.
            - id: close-location-explained
              selectedOptionIds: [close-location-explained]
              setFlags: { b1_choice: close-location-explained, b1_terminal: dismiss }
              feedback: Disposition recorded. The location explanation remains reviewable.
            - id: close-familiar-account
              selectedOptionIds: [close-familiar-account]
              setFlags: { b1_choice: close-familiar-account, b1_terminal: dismiss }
              feedback: Disposition recorded. The session owner remains unverified.
          coachOnFailure: Choose one documented disposition.
          successText: Disposition recorded.

    - id: scanner-alert-compare
      eventTemplateId: routine_alert_review
      actionId: review_alert
      systemId: alert_dashboard
      kind: compare_records
      title: Triage the new scanner alert
      whyItMatters: Interruptions need quick priority checks before they take over the main case.
      releasesActionGate: true
      steps:
        - id: scanner-identity
          title: Identify the source and target
          prompt: Capture the source and scope you need to compare with the approved maintenance record.
          instruction: Select the scanner name and affected network.
          relatedArtifactIds: [scanner-alert]
          minSelections: 2
          maxSelections: 2
          options:
            - id: scanner-name
              label: Scanner vuln-scan-03
            - id: finance-network
              label: Finance network
            - id: alert-number
              label: Alert number A-1180
            - id: low-color
              label: Low-priority dashboard color
          requiredOptionIds: [scanner-name, finance-network]
          coachOnFailure: Match operational facts—who generated traffic and where it went.
          successText: You captured the details needed for a schedule check.

    - id: scanner-window-match
      eventTemplateId: routine_alert_review
      actionId: search_knowledge_base
      systemId: knowledge_base
      kind: match_reference
      title: Check the approved scanner window
      whyItMatters: Trusted change records distinguish expected maintenance from unexplained activity.
      releasesActionGate: true
      steps:
        - id: schedule-match
          title: Match alert to change calendar
          prompt: Find the approved maintenance entry covering this scanner, time, and network.
          instruction: Match the recorded activity to the schedule entry.
          relatedArtifactIds: [scanner-alert, scanner-window]
          minSelections: 1
          maxSelections: 1
          options:
            - id: matching-window
              label: vuln-scan-03 · Monday 10:00–12:00 · finance network
            - id: wrong-system
              label: backup-night · daily 02:00–04:00 · storage network
            - id: no-schedule
              label: No approved scanner schedule exists
          requiredOptionIds: [matching-window]
          coachOnFailure: Match scanner name, time window, and target network together.
          successText: Alert matches the approved scanner window.

        - id: scanner-run-cross-check
          title: Corroborate the recorded scanner activity
          prompt: An approved window says what was allowed; the run log says what the scanner recorded doing. Connect the run to the alert before closing it.
          instruction: Select the matching run identity and scope, then the alert's recorded event time.
          relatedArtifactIds: [scanner-alert, scanner-run-log, scanner-window]
          minSelections: 2
          maxSelections: 2
          options:
            - id: run-identity-scope
              label: Recorded run identity, target scope, and change reference.
              source:
                artifactId: scanner-run-log
                quote: "RUN-FIN-031 · scanner vuln-scan-03 · target finance VLAN · change reference SCAN-FIN-MON."
            - id: recorded-event-time
              label: The alert event time to compare with the approved window.
              source:
                artifactId: scanner-alert
                quote: "Limit: priority is not approval. Match this source, target and recorded time to RUN-FIN-031 and SCAN-FIN-MON before bounded closure."
            - id: delivery-time
              label: Use delivery to this shift as the time of the scan.
              source:
                artifactId: scanner-run-log
                quote: "Delivery: monitoring forwarded the saved alert to the current shift after a queue delay."
            - id: schedule-owner
              label: Use the team that owns the schedule as the run match.
              source:
                artifactId: scanner-window
                quote: "Schedule owner: infrastructure operations."
          requiredOptionIds: [run-identity-scope, recorded-event-time]
          coachOnFailure: Compare recorded event time with the run interval and approved window. Arrival in your queue explains the interruption, not when the scan occurred; a schedule owner is not a run identifier.
          successText: You connected alert A-1180 to a recorded run within the approved scope and time.

    - id: scanner-ticket-summary
      eventTemplateId: routine_alert_review
      actionId: document_ticket
      systemId: ticket_queue
      kind: build_summary
      title: Document why routine work is safe to close
      whyItMatters: Even expected alerts need a record showing what was checked.
      releasesActionGate: true
      steps:
        - id: scanner-evidence
          title: Record the match
          prompt: Record the evidence that supports expected activity.
          instruction: Record the source, time, and scope match.
          relatedArtifactIds: [scanner-alert, scanner-window, scanner-run-log]
          minSelections: 2
          maxSelections: 2
          options:
            - id: scanner-matches
              label: A-1180 matches RUN-FIN-031 — scanner vuln-scan-03, finance VLAN, change reference SCAN-FIN-MON.
            - id: scope-matches
              label: Recorded Monday 10:18 activity fits the 10:05–10:32 run and approved 10:00–12:00 finance window; queue arrival is not event time.
            - id: priority-proves-safe
              label: Low priority alone proves the alert is safe
            - id: handoff-proves-safe
              label: The handoff alone proves the alert is safe
          requiredOptionIds: [scanner-matches, scope-matches]
          coachOnFailure: Use matching source, time, and scope—not priority or someone else's assumption.
          successText: Your note records the trusted schedule match.
        - id: scanner-coverage
          title: Keep the closure within the record's limits
          prompt: Record what the run log can support without turning an expected scan into a claim about every system's security.
          instruction: Select the run log's coverage statement for the ticket.
          relatedArtifactIds: [scanner-run-log]
          minSelections: 1
          maxSelections: 1
          options:
            - id: run-coverage-limit
              label: RUN-FIN-031 records discovery connections only; it does not establish vulnerability findings or prove every finance system is secure.
              source:
                artifactId: scanner-run-log
                quote: "Limit: discovery connections only, not weakness-check findings or proof every finance system is secure. Other source/network/time needs its own check."
            - id: run-completion-only
              label: Use the completed run status as the whole closure finding.
              source:
                artifactId: scanner-run-log
                quote: "Run status: completed."
          requiredOptionIds: [run-coverage-limit]
          coachOnFailure: Completed describes the run's status. Find what the log actually measures before claiming a security result; keep the closure specific to this connection alert.
          successText: The ticket distinguishes expected connection activity from a security assessment.
        - id: scanner-decision
          title: State the closure reason
          prompt: State the conclusion that fits the evidence.
          instruction: Write a closure reason another analyst can verify.
          relatedArtifactIds: [scanner-alert, scanner-window]
          minSelections: 1
          maxSelections: 1
          options:
            - id: expected-close
              label: Activity matches the approved scan; close as expected and check the queue for remaining work.
            - id: expected-close-with-monitoring
              label: Close this expected connection alert and keep later scanner activity under routine monitoring.
            - id: attack-close
              label: Record suspected misuse and close without a review handoff.
            - id: unexplained-close
              label: Record the cause as unknown and close based on low priority.
          requiredOptionIds: [expected-close]
          outcomes:
            - id: expected-close
              selectedOptionIds: [expected-close]
              setFlags: { d6_scanner: direct-close }
              feedback: Expected activity documented.
            - id: expected-close-with-monitoring
              selectedOptionIds: [expected-close-with-monitoring]
              setFlags: { d6_scanner: close-and-monitor }
              feedback: Expected activity documented; routine monitoring remains in place.
          coachOnFailure: Closure should say what matched and avoid unsupported claims.
          successText: Routine alert is documented and ready to close.

    - id: access-authority-check
      eventTemplateId: access_request
      actionId: route_access_request
      systemId: team_chat
      kind: choose_response
      title: Keep an urgent access request inside policy
      whyItMatters: Junior analysts help work move safely, but they do not approve access owned by another team.
      steps:
        - id: identify-approval-boundary
          title: Route the request
          prompt: The project is urgent and may be legitimate. Decide what you can do in your role.
          instruction: Choose the response supported by the request and access guide.
          relatedArtifactIds: [access-request-email, access-approval-guide]
          minSelections: 1
          maxSelections: 1
          options:
            - id: route-to-owner
              label: Verify the request details and route it to the finance data owner; keep access pending.
              source:
                artifactId: access-approval-guide
                quote: "Only the finance data owner can approve this role."
            - id: route-with-interim
              label: Route to the owner and offer an interim report without granting the requested role.
              source:
                artifactId: access-approval-guide
                quote: "Only the finance data owner can approve this role."
            - id: self-approve
              label: Give temporary read-only access until 17:00 while the owner reviews it.
              source:
                artifactId: access-request-email
                quote: "Director Chen approved the project deadline in chat."
            - id: reject-as-attack
              label: Ask the director who approved the deadline to approve the role as well.
              source:
                artifactId: access-approval-guide
                quote: "Urgency does not change the approval owner."
          requiredOptionIds: [route-to-owner]
          outcomes:
            - id: route-to-owner
              selectedOptionIds: [route-to-owner]
              setFlags: { b2_choice: route-to-owner }
              resolution: The request was routed to the finance data owner; approval is pending and no access has been granted.
              feedback: Request routed to the data owner.
            - id: route-with-interim
              selectedOptionIds: [route-with-interim]
              setFlags: { b2_choice: route-with-interim }
              resolution: The request was routed to the finance data owner with an interim report offered; role approval is pending and no new access has been granted.
              feedback: Owner review is pending; an interim report can keep work moving.
            - id: self-approve
              selectedOptionIds: [self-approve]
              setFlags: { b2_choice: self-approve }
              resolution: Access was approved without the data owner's authorization; the decision remains recorded for review.
              feedback: Your approval was committed. The authorization boundary will be reviewed.
            - id: reject-as-attack
              selectedOptionIds: [reject-as-attack]
              setFlags: { b2_choice: reject-as-attack }
              resolution: The request was rejected as suspicious; the business request remains unresolved.
              feedback: Rejection recorded. The coworker still needs a route for the request.
          coachOnFailure: Choose one response.
          successText: Access decision recorded.

    - id: employee-login-troubleshooting
      eventTemplateId: employee_login_help
      actionId: resolve_login_help
      systemId: ticket_queue
      kind: build_summary
      title: Document a login problem without jumping to an attack
      whyItMatters: Analysts compare ordinary explanations with records before escalating routine trouble.
      steps:
        - id: login-help-evidence
          title: Compare the device activity
          prompt: Identify what the login records actually show.
          instruction: Select both observations that explain why more troubleshooting is appropriate.
          relatedArtifactIds: [rivera-login-email, rivera-auth-summary]
          minSelections: 2
          maxSelections: 2
          options:
            - id: phone-retries
              label: The managed phone made repeated saved-password retries.
              source:
                artifactId: rivera-auth-summary
                quote: "08:36–08:41: corp-phone-rivera made five failed saved-password retries."
            - id: laptop-success
              label: The managed laptop successfully used the updated password.
              source:
                artifactId: rivera-auth-summary
                quote: "08:42: corp-macbook-rivera completed a successful sign-in with the updated password."
            - id: employee-device-report
              label: The employee reports that the managed laptop still works.
              source:
                artifactId: rivera-login-email
                quote: "I can still sign in on my work laptop."
            - id: attack-confirmed
              label: The new password worked on the laptop, so the phone's saved password is already current.
              source:
                artifactId: rivera-login-email
                quote: "I can still sign in on my work laptop."
          requiredOptionIds: [phone-retries, laptop-success]
          outcomes:
            - id: record-comparison
              selectedOptionIds: [phone-retries, laptop-success]
              setFlags: { d8_login_help: compared-records }
              feedback: Device records compared.
            - id: report-comparison
              selectedOptionIds: [phone-retries, employee-device-report]
              setFlags: { d8_login_help: employee-report }
              feedback: Employee report recorded; the laptop sign-in record remains available to verify.
          coachOnFailure: Compare which known device failed and which known device succeeded. Attempt counts alone do not identify a person.
          successText: You found a device-specific pattern instead of treating every failure as an attack.
        - id: login-help-next-step
          title: Record the bounded next step
          prompt: Choose a troubleshooting step that fits the evidence while leaving room to reassess.
          instruction: Use the approved guide and preserve what is still uncertain.
          relatedArtifactIds: [login-troubleshooting-guide, ticket-login-help]
          minSelections: 1
          maxSelections: 1
          options:
            - id: update-saved-password
              label: Ask the employee to update the saved password in the phone app, then monitor for retries.
              source:
                artifactId: login-troubleshooting-guide
                quote: "A working sign-in on one known device plus repeated retries from another known device can indicate a stale saved password."
            - id: name-attacker
              label: Record an attacker as the confirmed cause of the failed attempts.
              source:
                artifactId: login-troubleshooting-guide
                quote: "Failed attempts do not identify an attacker."
            - id: grant-access
              label: Change the employee's access role so the phone can sign in.
              source:
                artifactId: ticket-login-help
                quote: "No access-role change is requested or supported by these records."
          requiredOptionIds: [update-saved-password]
          coachOnFailure: Use the least disruptive step that tests the ordinary explanation. Keep monitoring if the retries continue.
          successText: The ticket records a safe troubleshooting step and a reason to reopen if the pattern continues.

    - id: morgan-midshift-update
      eventTemplateId: morgan_status_check
      actionId: send_status_update
      systemId: team_chat
      kind: build_summary
      title: Give Morgan a useful status update
      whyItMatters: Teammates need facts, uncertainty, and the next action—not a confident guess.
      steps:
        - id: status-confirmed
          title: State what is confirmed
          prompt: Give Morgan one concise confirmed observation from A-1042.
          instruction: Choose what the opened record directly supports.
          relatedArtifactIds: [suspicious-login-alert]
          minSelections: 1
          maxSelections: 1
          options:
            - id: confirmed-sequence
              label: A-1042 records six failed checks followed by a successful session from unknown-laptop-17.
              source:
                artifactId: suspicious-login-alert
                quote: "07:38–07:40: Source IP 203.0.113.44 reported 6 failed MFA challenges."
            - id: confirmed-source
              label: A-1042 records a flagged source address, while the person behind it remains unknown.
              source:
                artifactId: suspicious-login-alert
                quote: "07:38–07:40: Source IP 203.0.113.44 reported 6 failed MFA challenges."
            - id: confirmed-person
              label: A-1042 confirms who controlled the session.
              source:
                artifactId: suspicious-login-alert
                quote: "Limit: network estimate, not verified travel or identity. Alert and context summarize the same timeline. Compare earlier S-0731's route separately; priority is not proof of compromise."
          requiredOptionIds: [confirmed-sequence]
          outcomes:
            - id: confirmed-sequence
              selectedOptionIds: [confirmed-sequence]
              setFlags: { d9_status: sequence }
              feedback: Recorded sequence included in the status.
            - id: confirmed-source
              selectedOptionIds: [confirmed-source]
              setFlags: { d9_status: source-only }
              feedback: Source address included; sequence detail remains available in A-1042.
          coachOnFailure: Report the recorded sequence. The alert does not identify a person.
          successText: Your update starts with a fact another analyst can verify.
        - id: status-uncertain
          title: Name the uncertainty
          prompt: Tell Morgan what the current records cannot establish.
          instruction: Keep the collection limit visible.
          relatedArtifactIds: [login-session-timeline]
          minSelections: 1
          maxSelections: 1
          options:
            - id: identity-uncertain
              label: The records do not establish who controlled S-0741 or what data was accessed.
              source:
                artifactId: login-session-timeline
                quote: "Limit: collection ends 07:45; no file/mail activity collected. A-1042 and login-context-1 summarize this same source, not independent corroboration."
            - id: nothing-accessed
              label: The export proves that no files or mail were accessed.
              source:
                artifactId: login-session-timeline
                quote: "Limit: collection ends 07:45; no file/mail activity collected. A-1042 and login-context-1 summarize this same source, not independent corroboration."
          requiredOptionIds: [identity-uncertain]
          coachOnFailure: Missing activity fields are a collection gap, not proof that nothing happened.
          successText: Morgan can see the boundary between evidence and inference.
        - id: status-next
          title: Name the next action
          prompt: Finish with the concrete work you will do next.
          instruction: Choose the step that preserves evidence and keeps authority with the reviewer.
          relatedArtifactIds: [ticket-suspicious-login]
          minSelections: 1
          maxSelections: 1
          options:
            # Recorded state decides what "next" honestly is: once the ticket
            # is documented and the escalation sent, the note/review options
            # would demand work that is already done.
            - id: document-and-review
              label: Finish the evidence/uncertainty note, then request bounded senior review.
              when:
                - flag: b1_choice
                  notEquals: escalate-with-comparisons
              source:
                artifactId: ticket-suspicious-login
                quote: "Next step: name the review you are requesting and the question it should resolve."
            - id: review-in-progress
              label: Senior review of the escalated session is in progress; ownership stays unverified.
              when:
                - flag: b1_choice
                  equals: escalate-with-comparisons
              source:
                artifactId: ticket-suspicious-login
                quote: "Limit: saving analysis proposes a disposition; send the explicit request or closure from Alerts."
            - id: close-on-location
              label: Close the case because the displayed city explains the session.
              source:
                artifactId: ticket-suspicious-login
                quote: "Limit: saving analysis proposes a disposition; send the explicit request or closure from Alerts."
          requiredOptionIds: [document-and-review]
          conditionalRequiredOptionIds:
            - when: [{ flag: b1_choice, equals: escalate-with-comparisons }]
              optionIds: [review-in-progress]
          coachOnFailure: Name a reversible next step that uses the records and preserves the open question.
          successText: Morgan has a status update that supports the next handoff.

    - id: end-shift-continuity
      eventTemplateId: end_shift_handoff
      actionId: submit_shift_handoff
      systemId: team_chat
      kind: build_summary
      title: Leave the next analyst a usable handoff
      whyItMatters: Professional continuity means unfinished work can continue without repeating the whole shift.
      steps:
        - id: handoff-checked
          title: Record completed checks
          prompt: Name the work that was completed this shift.
          instruction: Select the two traceable checks the next analyst can rely on.
          relatedArtifactIds: [ticket-suspicious-login, scanner-run-log]
          minSelections: 2
          maxSelections: 2
          options:
            - id: login-records-checked
              label: A-1042 was compared with the exact device, session route, employee report, and record-coverage limits.
              source:
                artifactId: ticket-suspicious-login
                quote: "Limit: saving analysis proposes a disposition; send the explicit request or closure from Alerts."
            - id: scanner-checked
              label: A-1180 matched RUN-FIN-031 and the approved finance scanning window.
              source:
                artifactId: scanner-run-log
                quote: "A-1180 refers to connection activity at 10:18 within this run."
            - id: everything-secure
              label: The scanner run proves every finance system is secure.
              source:
                artifactId: scanner-run-log
                quote: "Limit: discovery connections only, not weakness-check findings or proof every finance system is secure. Other source/network/time needs its own check."
            - id: checks-omitted
              label: Leave the completed checks out of the first handoff draft.
              source:
                artifactId: scanner-run-log
                quote: "A-1180 refers to connection activity at 10:18 within this run."
          requiredOptionIds: [login-records-checked, scanner-checked]
          outcomes:
            - id: complete-checks
              selectedOptionIds: [login-records-checked, scanner-checked]
              setFlags: { handoff_omission: no }
              feedback: Completed checks are preserved.
            - id: omitted-checks
              selectedOptionIds: [checks-omitted]
              setFlags: { handoff_omission: yes }
              recordOmission: true
              feedback: Initial handoff omitted the completed checks. You can correct the record later.
          coachOnFailure: Preserve the checks and their references. Do not broaden a routine closure into a security guarantee.
          successText: The next analyst can see what was already checked.
        - id: handoff-open-question
          title: Preserve the unresolved question
          prompt: State what remains unresolved after escalation.
          instruction: Choose the uncertainty that still needs reviewer work.
          relatedArtifactIds: [login-session-timeline, shift-handoff-prompt]
          minSelections: 1
          maxSelections: 2
          options:
            - id: reviewer-question
              label: Senior review still needs to determine who controlled S-0741 and whether containment is warranted.
              source:
                artifactId: shift-handoff-prompt
                quote: "An escalation can end your junior-analyst step while the underlying question remains open."
            - id: attack-proven
              label: Escalation proves an attacker controlled S-0741.
              source:
                artifactId: login-session-timeline
                quote: "Limit: collection ends 07:45; no file/mail activity collected. A-1042 and login-context-1 summarize this same source, not independent corroboration."
            - id: closure-review-question
              label: If A-1042 was closed, preserve why the session owner still merits later review.
              source:
                artifactId: shift-handoff-prompt
                quote: "An escalation can end your junior-analyst step while the underlying question remains open."
          requiredOptionIds: [reviewer-question]
          conditionalRequiredOptionIds:
            - when: [{ flag: b1_terminal, equals: dismiss }]
              optionIds: [closure-review-question]
          coachOnFailure: Escalation transfers review; it does not turn suspicion into proof.
          successText: Your handoff keeps the unresolved question visible.
        - id: handoff-next-owner
          title: Name the next owner and action
          prompt: Finish with who should continue and what they should use.
          instruction: Choose a bounded continuity step.
          relatedArtifactIds: [shift-handoff-prompt]
          minSelections: 1
          maxSelections: 1
          options:
            - id: next-analyst-review
              label: Next analyst monitors the senior review and uses the saved ticket sources instead of rebuilding the case.
              source:
                artifactId: shift-handoff-prompt
                quote: "Point the next analyst to saved sources and the pending reviewer question."
            - id: start-over
              label: Next analyst should discard the notes and repeat every check.
              source:
                artifactId: shift-handoff-prompt
                quote: "Good continuity avoids making the next person reconstruct completed work."
            - id: correct-omission
              label: Correct the first draft and add the omitted check references for the next analyst.
              source:
                artifactId: shift-handoff-prompt
                quote: "Point the next analyst to saved sources and the pending reviewer question."
            - id: send-thin
              label: Send the handoff with the initial omission still visible.
              source:
                artifactId: shift-handoff-prompt
                quote: "Point the next analyst to saved sources and the pending reviewer question."
          requiredOptionIds: [next-analyst-review]
          outcomes:
            - id: complete
              selectedOptionIds: [next-analyst-review]
              when: [{ flag: handoff_omission, equals: no }]
              setFlags: { b3_choice: complete }
              feedback: Complete handoff sent.
            - id: corrected
              selectedOptionIds: [correct-omission]
              when: [{ flag: handoff_omission, equals: yes }]
              setFlags: { b3_choice: corrected }
              correctsOmission: true
              feedback: Correction sent. The initial omission remains in the record.
            - id: thin
              selectedOptionIds: [send-thin]
              when: [{ flag: handoff_omission, equals: yes }]
              setFlags: { b3_choice: thin }
              resolution: A thin handoff was sent; the next analyst still needs the omitted references.
              feedback: Thin handoff sent. The omitted references remain open.
          coachOnFailure: Choose a continuity step supported by this draft.
          successText: Handoff sent.

  notifications:
    - id: access-request-arrived
      eventTemplateId: access_request
      systemId: email
      title: Urgent access request
      body: A coworker needs project access. Check who owns approval before acting.
      priority: normal
      snoozeMinutes: 10
    - id: routine-scanner-arrived
      eventTemplateId: routine_alert_review
      systemId: alert_dashboard
      title: New low-priority scanner alert
      body: A routine-looking alert arrived while you were investigating the login. Triage it now, snooze it once, or keep your current view open.
      priority: low
      snoozeMinutes: 15
    - id: login-help-arrived
      eventTemplateId: employee_login_help
      systemId: email
      title: Employee login trouble
      body: An employee reports repeated password prompts while another device still works.
      priority: normal
      snoozeMinutes: 10
    - id: status-check-arrived
      eventTemplateId: morgan_status_check
      systemId: team_chat
      title: Morgan asks for a status update
      body: Share what is confirmed, what remains uncertain, and what you will do next.
      priority: normal
      snoozeMinutes: 10
    - id: handoff-reminder
      eventTemplateId: end_shift_handoff
      systemId: team_chat
      title: Prepare shift handoff
      body: Leave the next analyst completed checks, uncertainty, and a clear continuation point.
      priority: normal
      snoozeMinutes: 10
  facts:
    - id: alert-visible
      content: >
        A successful login occurred from an unfamiliar location shortly after
        repeated failures.
      visibility: public
      knownBy: [manager, user]
      notKnownBy: []
    - id: manager-managed-device-context
      content: >
        Morgan has seen Patel use the organization's managed MacBook and phone.
        Team inventory covers enrolled work devices, not every personally owned device.
      visibility: role_restricted
      knownBy: [manager]
      notKnownBy: [user]
    - id: employee-private-travel
      content: The employee privately disclosed planned travel to Montreal.
      visibility: private
      knownBy: [employee]
      notKnownBy: [manager, user]
  npcs:
    - id: manager
      name: Morgan
      role: Security Operations Manager
      mood: neutral
      memoryFactIds: [alert-visible, manager-managed-device-context]
  actions:
    - id: read_handoff
      systemId: email
      label: Read shift handoff
      description: Review the previous analyst's incomplete handoff notes.
      simulatedMinutes: 5
      energyCost: 2
      defaultEffect:
        observeArtifactIds: [handoff-email]
    - id: acknowledge_handoff
      systemId: team_chat
      label: Confirm the handoff
      description: Tell Morgan what remains open and what you will handle first.
      simulatedMinutes: 5
      energyCost: 1
      defaultEffect:
        resolve: true
        resolution: >
          You confirmed the open work and stated your initial priority to Morgan.
        emitEventResolved: true
        callbacks:
          - id: d1-routine-first-note
            delayMinutes: 15
            when: [{ flag: d1_triage, equals: routine-first }]
            author: morgan
            body: I saw your scanner-first plan. Keep the unfamiliar login visible as you return to it.
        hidden:
          taskBacklog: -1
    - id: review_alert
      systemId: alert_dashboard
      label: Review alert
      description: Read the alert details and initial indicators.
      simulatedMinutes: 10
      energyCost: 4
      defaultEffect:
        hidden:
          cognitiveLoad: 1
    - id: inspect_login_context
      systemId: alert_dashboard
      label: Inspect login context
      description: Check available device, location, and account context.
      simulatedMinutes: 15
      energyCost: 5
      defaultEffect:
        observeArtifactIds: [login-context-1]
        hidden:
          accuracy: 1
    - id: inspect_account_history
      systemId: alert_dashboard
      label: Compare account history
      description: Compare recent sign-ins, failures, and normal account patterns.
      simulatedMinutes: 10
      energyCost: 4
      defaultEffect:
        observeArtifactIds: [account-history-1]
        hidden:
          accuracy: 1
    - id: check_device_inventory
      systemId: knowledge_base
      label: Check device inventory
      description: Confirm whether the device is enrolled and assigned to the employee.
      simulatedMinutes: 10
      energyCost: 4
      defaultEffect:
        observeArtifactIds: [device-inventory-1]
        hidden:
          accuracy: 1
    - id: query_records
      systemId: alert_dashboard
      label: Search records
      description: Query structured records for explicit identifiers, accounts, or time windows.
      simulatedMinutes: 2
      energyCost: 0
      tracksCompletion: false
    - id: search_knowledge_base
      systemId: knowledge_base
      label: Check response procedure
      description: Review the approved procedure and closure criteria for this event.
      simulatedMinutes: 10
      energyCost: 3
      defaultEffect:
        setKbQueryFromFreeText: true
    - id: dismiss_alert
      systemId: alert_dashboard
      label: Close as expected activity
      description: Close the queue item using your documented match; closing records what was checked and does not verify any person.
      simulatedMinutes: 15
      energyCost: 2
    - id: escalate_alert
      systemId: alert_dashboard
      label: Escalate with evidence
      description: Request senior review with the saved evidence and uncertainty; this does not confirm account misuse.
      simulatedMinutes: 5
      energyCost: 1
      defaultEffect:
        resolve: true
        resolution: Escalated with reviewed context; the evidence and remaining uncertainty are ready for senior review. The session owner is still unverified.
        emitEventResolved: true
        consequence:
          escalateOnApply: false
          description: >
            A senior analyst received the alert with the reviewed records, employee report,
            and documented uncertainty. They can review containment without reconstructing
            the investigation. Escalation requests a review; it does not establish who signed in.
        hidden:
          taskBacklog: -1
    - id: document_ticket
      systemId: ticket_queue
      label: Document ticket
      description: Record what was reviewed and why the decision was made.
      simulatedMinutes: 20
      energyCost: 3
      defaultEffect:
        setTicketNotesFromFreeText: true
        consequence:
          escalateOnApply: false
          description: >
            The {{eventTitle}} ticket now records the evidence, reasoning, and next step. Documentation preserves the review trail; it does not close the alert or verify an identity.
    - id: update_ticket_notes
      systemId: ticket_queue
      label: Update investigation notes
      description: Edit the ticket investigation notes without closing the work.
      simulatedMinutes: 0
      energyCost: 0
      tracksCompletion: false
      defaultEffect:
        setTicketNotesFromFreeText: true
    - id: update_notebook
      systemId: ticket_queue
      label: Update case notebook
      description: Save personal investigation notes that persist across systems.
      simulatedMinutes: 0
      energyCost: 0
      tracksCompletion: false
      defaultEffect:
        setNotebookFromFreeText: true
    - id: route_access_request
      systemId: team_chat
      label: Route request to the data owner
      description: Keep the urgent request moving without approving access outside your role.
