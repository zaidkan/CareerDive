      kind: chat_thread
      title: Morgan · end-of-shift handoff
      summary: Continuity checklist
      body: |
        An escalation can end your junior-analyst step while the underlying question remains open.
        Point the next analyst to saved sources and the pending reviewer question.
        Good continuity avoids making the next person reconstruct completed work.
      eventIds: [shift-handoff-1]
      relatedArtifactIds: [ticket-suspicious-login, scanner-run-log]
      searchableText: handoff continuity next analyst review
