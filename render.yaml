# Template only. Creating/applying this blueprint starts external deployment;
# owner must complete the activation runbook and explicitly approve deployment.
services:
  - type: web
    name: careerdive-api
    runtime: docker
    dockerfilePath: ./Dockerfile.server
    healthCheckPath: /ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: INSTITUTIONAL_DEPLOYMENT_ENABLED
        value: "false"
  - type: web
    name: careerdive-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PORT
        value: "8080"
      - key: VITE_SERVER_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SITE_ORIGIN
        sync: false
      - key: BUILD_SHA
        sync: false
      - key: VITE_LAUNCH_ANALYTICS_ENABLED
        value: "true"
