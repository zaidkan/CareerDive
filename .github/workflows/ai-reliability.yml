name: AI reliability

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  multi-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Preflight paid AI evals
        id: preflight
        shell: bash
        env:
          ENABLE_PAID_AI_EVALS: ${{ vars.ENABLE_PAID_AI_EVALS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail

          ready=true
          reason=""
          if [[ "${ENABLE_PAID_AI_EVALS:-}" != "true" ]]; then
            ready=false
            reason="ENABLE_PAID_AI_EVALS is not true"
          elif [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            ready=false
            reason="ANTHROPIC_API_KEY is unavailable"
          else
            if [[ ! -d packages/testing/ai-evals ]] ||
               [[ -z "$(find packages/testing/ai-evals -type f -name '*.test.ts' -print -quit)" ]]; then
              ready=false
              reason="no AI eval test files found"
            fi
          fi

          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" == "true" ]]; then
            echo "Paid AI evals enabled: prerequisites found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Paid AI evals skipped: $reason." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.preflight.outputs.ready == 'true'
      - run: pnpm vitest run --config vitest.ai.config.ts
        if: steps.preflight.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
