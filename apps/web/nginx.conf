server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /health { default_type application/json; return 200 '{"status":"alive"}'; }
  # Render uses a separate public API origin; never mask API errors with SPA HTML.
  location ^~ /api/ { default_type application/json; return 404 '{"error":"use_api_origin"}'; }
  location ^~ /trpc { default_type application/json; return 404 '{"error":"use_api_origin"}'; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
}
