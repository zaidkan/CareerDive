<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C0F14" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Career Expo" />
    <meta property="og:title" content="Experience the work before choosing a career · Career Expo" />
    <meta
      property="og:description"
      content="Explore careers through realistic first-day work, practical previews, and reflection."
    />
    <meta property="og:url" content="https://careerexpo.example.com/" />
    <meta property="og:image" content="https://careerexpo.example.com/og.png" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:description"
      content="Explore careers through realistic first-day work, practical previews, and reflection."
    />
    <meta name="twitter:image" content="https://careerexpo.example.com/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var stored = localStorage.getItem("career-expo-theme");
        var theme = stored === "light" || stored === "dark" ? stored : null;
        if (!theme && window.matchMedia("(prefers-color-scheme: light)").matches) {
          theme = "light";
        }
        document.documentElement.dataset.theme = theme || "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
