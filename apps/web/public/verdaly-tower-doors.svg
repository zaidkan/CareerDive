<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Verdaly tower entrance: glass doors glowing at night beneath the VERDALY sign">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f1a"/>
      <stop offset="0.45" stop-color="#101827"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2233"/>
      <stop offset="1" stop-color="#0e1420"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a40" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0c121c" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="doorGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e7b4" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#e8c97a" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#c9a24e" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="wet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c2a"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <radialGradient id="spill" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#f0d48a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0d48a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="signGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6ea8fe" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6ea8fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mullion" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4558"/>
      <stop offset="0.5" stop-color="#5a6a82"/>
      <stop offset="1" stop-color="#3a4558"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3346"/>
      <stop offset="1" stop-color="#141b28"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="glowBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Night sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Distant city silhouettes -->
  <g fill="#0c121c" opacity="0.85">
    <rect x="0" y="380" width="140" height="460"/>
    <rect x="120" y="440" width="90" height="400"/>
    <rect x="1380" y="360" width="130" height="480"/>
    <rect x="1490" y="420" width="110" height="420"/>
    <rect x="200" y="500" width="70" height="340"/>
    <rect x="1320" y="490" width="60" height="350"/>
  </g>
  <!-- Distant windows -->
  <g fill="#6ea8fe" opacity="0.25">
    <rect x="20" y="410" width="10" height="14"/><rect x="48" y="410" width="10" height="14"/>
    <rect x="20" y="450" width="10" height="14"/><rect x="76" y="450" width="10" height="14"/>
    <rect x="1410" y="400" width="10" height="14"/><rect x="1440" y="400" width="10" height="14"/>
    <rect x="1410" y="440" width="10" height="14"/><rect x="1470" y="470" width="10" height="14"/>
    <rect x="1520" y="460" width="10" height="14"/><rect x="1555" y="500" width="10" height="14"/>
  </g>

  <!-- Main tower mass -->
  <rect x="340" y="60" width="920" height="780" fill="url(#facade)"/>
  <!-- Vertical facade ribs -->
  <g stroke="#243044" stroke-width="2" opacity="0.7">
    <line x1="430" y1="60" x2="430" y2="520"/>
    <line x1="520" y1="60" x2="520" y2="520"/>
    <line x1="610" y1="60" x2="610" y2="520"/>
    <line x1="990" y1="60" x2="990" y2="520"/>
    <line x1="1080" y1="60" x2="1080" y2="520"/>
    <line x1="1170" y1="60" x2="1170" y2="520"/>
  </g>
  <!-- Upper window bands -->
  <g fill="#121a28" stroke="#2a3548" stroke-width="1.5">
    <rect x="360" y="90" width="220" height="70" rx="2"/>
    <rect x="600" y="90" width="220" height="70" rx="2"/>
    <rect x="840" y="90" width="220" height="70" rx="2"/>
    <rect x="1080" y="90" width="160" height="70" rx="2"/>
    <rect x="360" y="180" width="220" height="70" rx="2"/>
    <rect x="600" y="180" width="220" height="70" rx="2"/>
    <rect x="840" y="180" width="220" height="70" rx="2"/>
    <rect x="1080" y="180" width="160" height="70" rx="2"/>
    <rect x="360" y="270" width="220" height="70" rx="2"/>
    <rect x="600" y="270" width="220" height="70" rx="2"/>
    <rect x="840" y="270" width="220" height="70" rx="2"/>
    <rect x="1080" y="270" width="160" height="70" rx="2"/>
    <rect x="360" y="360" width="220" height="70" rx="2"/>
    <rect x="600" y="360" width="220" height="70" rx="2"/>
    <rect x="840" y="360" width="220" height="70" rx="2"/>
    <rect x="1080" y="360" width="160" height="70" rx="2"/>
  </g>
  <!-- Lit windows (sparse, lived-in) -->
  <g fill="#e8c97a" opacity="0.55">
    <rect x="360" y="90" width="220" height="70" rx="2" opacity="0.2"/>
    <rect x="840" y="180" width="220" height="70" rx="2" opacity="0.35"/>
    <rect x="600" y="360" width="220" height="70" rx="2" opacity="0.15"/>
    <rect x="1080" y="270" width="160" height="70" rx="2" opacity="0.28"/>
  </g>

  <!-- Entrance portal surround -->
  <rect x="500" y="480" width="600" height="360" fill="#0b1018"/>
  <rect x="508" y="488" width="584" height="344" fill="none" stroke="#2e3a4e" stroke-width="3"/>

  <!-- Canopy -->
  <rect x="470" y="470" width="660" height="22" rx="3" fill="url(#canopy)"/>
  <rect x="470" y="492" width="660" height="4" fill="#3d4c64" opacity="0.6"/>
  <!-- Canopy light strip -->
  <rect x="500" y="494" width="600" height="3" fill="#f0d48a" opacity="0.7"/>

  <!-- Signage plaque -->
  <rect x="560" y="390" width="480" height="78" rx="4" fill="#0d131c" stroke="#3a4558" stroke-width="2"/>
  <ellipse cx="800" cy="429" rx="240" ry="50" fill="url(#signGlow)" filter="url(#soft)"/>
  <text x="800" y="428" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="52" font-weight="700" letter-spacing="18" fill="#e8edf5">VERDALY</text>
  <text x="800" y="456" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="7" fill="#2dd4bf">TECHNOLOGIES · TRUST &amp; SAFETY</text>

  <!-- Door light spill onto pavement -->
  <ellipse cx="800" cy="840" rx="340" ry="70" fill="url(#spill)" filter="url(#glowBlur)"/>

  <!-- Glass curtain wall around doors -->
  <rect x="530" y="510" width="540" height="330" fill="url(#glass)"/>
  <!-- Curtain mullions -->
  <g stroke="url(#mullion)" stroke-width="3">
    <line x1="530" y1="510" x2="530" y2="840"/>
    <line x1="1070" y1="510" x2="1070" y2="840"/>
    <line x1="530" y1="510" x2="1070" y2="510"/>
    <line x1="665" y1="510" x2="665" y2="840"/>
    <line x1="935" y1="510" x2="935" y2="840"/>
    <line x1="530" y1="620" x2="665" y2="620"/>
    <line x1="935" y1="620" x2="1070" y2="620"/>
    <line x1="530" y1="730" x2="665" y2="730"/>
    <line x1="935" y1="730" x2="1070" y2="730"/>
  </g>

  <!-- Side panel reflections -->
  <path d="M540 520 L640 520 L560 830 L540 830 Z" fill="#6ea8fe" opacity="0.06"/>
  <path d="M960 520 L1060 520 L1060 830 L1040 830 Z" fill="#6ea8fe" opacity="0.05"/>

  <!-- Warm interior glow behind doors -->
  <rect x="675" y="530" width="250" height="310" fill="url(#doorGlow)" opacity="0.25" filter="url(#soft)"/>

  <!-- Double doors -->
  <rect x="680" y="530" width="115" height="310" rx="2" fill="url(#doorGlow)"/>
  <rect x="805" y="530" width="115" height="310" rx="2" fill="url(#doorGlow)"/>
  <!-- Door frames -->
  <rect x="680" y="530" width="115" height="310" rx="2" fill="none" stroke="#8a7340" stroke-width="3"/>
  <rect x="805" y="530" width="115" height="310" rx="2" fill="none" stroke="#8a7340" stroke-width="3"/>
  <!-- Center meeting stile -->
  <rect x="795" y="530" width="10" height="310" fill="#6b5830"/>
  <!-- Door glass panes (upper) -->
  <rect x="692" y="545" width="91" height="160" rx="1" fill="#1a2233" opacity="0.35"/>
  <rect x="817" y="545" width="91" height="160" rx="1" fill="#1a2233" opacity="0.35"/>
  <!-- Push bars -->
  <rect x="700" y="680" width="55" height="8" rx="4" fill="#3d3420"/>
  <rect x="845" y="680" width="55" height="8" rx="4" fill="#3d3420"/>
  <!-- Threshold -->
  <rect x="675" y="836" width="250" height="8" fill="#2a3346"/>

  <!-- Interior silhouette suggestion -->
  <g fill="#5a4520" opacity="0.35">
    <rect x="720" y="700" width="50" height="130" rx="4"/>
    <rect x="840" y="720" width="40" height="110" rx="4"/>
  </g>

  <!-- Pavement -->
  <rect x="0" y="840" width="1600" height="60" fill="url(#wet)"/>
  <!-- Pavement reflection of door glow -->
  <rect x="675" y="840" width="250" height="60" fill="#e8c97a" opacity="0.12"/>
  <rect x="720" y="840" width="60" height="60" fill="#f6e7b4" opacity="0.1"/>
  <rect x="820" y="840" width="60" height="60" fill="#f6e7b4" opacity="0.1"/>
  <!-- Pavement joints -->
  <g stroke="#1a2233" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="860" x2="1600" y2="860"/>
    <line x1="200" y1="840" x2="180" y2="900"/>
    <line x1="500" y1="840" x2="480" y2="900"/>
    <line x1="1100" y1="840" x2="1120" y2="900"/>
    <line x1="1400" y1="840" x2="1420" y2="900"/>
  </g>

  <!-- Bollards -->
  <g fill="#1c2536" stroke="#3a4558" stroke-width="1.5">
    <rect x="560" y="800" width="14" height="48" rx="7"/>
    <rect x="1026" y="800" width="14" height="48" rx="7"/>
    <rect x="480" y="810" width="12" height="42" rx="6"/>
    <rect x="1108" y="810" width="12" height="42" rx="6"/>
  </g>
  <!-- Bollard reflectors -->
  <rect x="562" y="812" width="10" height="4" rx="2" fill="#2dd4bf" opacity="0.7"/>
  <rect x="1028" y="812" width="10" height="4" rx="2" fill="#2dd4bf" opacity="0.7"/>

  <!-- Subtle vignette -->
  <rect width="1600" height="900" fill="none"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)" opacity="0.15" style="mix-blend-mode:multiply"/>
</svg>
