  <text x="800" y="350" text-anchor="middle" font-family="Verdana, sans-serif" font-size="26" letter-spacing="8" fill="#2dd4bf">TRUST &amp; SAFETY OPS</text>
  <rect x="700" y="620" width="200" height="220" rx="4" fill="#f3d47a" opacity="0.92"/>
  <rect x="720" y="640" width="160" height="200" rx="2" fill="#0d0f12" opacity="0.85"/>
  <rect x="0" y="840" width="1600" height="60" fill="#05070a"/>
