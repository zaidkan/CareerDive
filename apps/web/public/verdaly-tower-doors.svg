      <stop offset="0" stop-color="#232b38"/>
      <stop offset="0.55" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#6ea8fe" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6ea8fe" stop-opacity="0"/>
    </radialGradient>
