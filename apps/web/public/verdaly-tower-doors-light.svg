<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Verdaly tower entrance: glass doors in daylight beneath the VERDALY sign">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dce8f5"/>
      <stop offset="0.55" stop-color="#eef3f8"/>
      <stop offset="1" stop-color="#f7f3ea"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e4da"/>
      <stop offset="1" stop-color="#d4cfc3"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5d4e4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a8bdd2" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="doorGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5efe2"/>
      <stop offset="0.5" stop-color="#ebe2cf"/>
      <stop offset="1" stop-color="#ddd2b8"/>
    </linearGradient>
    <linearGradient id="wet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc8ba"/>
      <stop offset="1" stop-color="#bdb6a8"/>
    </linearGradient>
    <radialGradient id="spill" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="signGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mullion" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a8478"/>
      <stop offset="0.5" stop-color="#a8a296"/>
      <stop offset="1" stop-color="#8a8478"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9488"/>
      <stop offset="1" stop-color="#7a7468"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="glowBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Day sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Soft clouds -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="280" cy="120" rx="160" ry="40"/>
    <ellipse cx="360" cy="110" rx="100" ry="32"/>
    <ellipse cx="1300" cy="150" rx="180" ry="42"/>
    <ellipse cx="1220" cy="140" rx="110" ry="30"/>
  </g>

  <!-- Distant city silhouettes -->
  <g fill="#b8c4d2" opacity="0.7">
    <rect x="0" y="380" width="140" height="460"/>
    <rect x="120" y="440" width="90" height="400"/>
    <rect x="1380" y="360" width="130" height="480"/>
    <rect x="1490" y="420" width="110" height="420"/>
    <rect x="200" y="500" width="70" height="340"/>
    <rect x="1320" y="490" width="60" height="350"/>
  </g>
  <!-- Distant windows -->
  <g fill="#ffffff" opacity="0.5">
    <rect x="20" y="410" width="10" height="14"/><rect x="48" y="410" width="10" height="14"/>
    <rect x="20" y="450" width="10" height="14"/><rect x="76" y="450" width="10" height="14"/>
    <rect x="1410" y="400" width="10" height="14"/><rect x="1440" y="400" width="10" height="14"/>
    <rect x="1410" y="440" width="10" height="14"/><rect x="1470" y="470" width="10" height="14"/>
    <rect x="1520" y="460" width="10" height="14"/><rect x="1555" y="500" width="10" height="14"/>
  </g>

  <!-- Main tower mass -->
  <rect x="340" y="60" width="920" height="780" fill="url(#facade)"/>
  <!-- Vertical facade ribs -->
  <g stroke="#c4bfb4" stroke-width="2" opacity="0.8">
    <line x1="430" y1="60" x2="430" y2="520"/>
    <line x1="520" y1="60" x2="520" y2="520"/>
    <line x1="610" y1="60" x2="610" y2="520"/>
    <line x1="990" y1="60" x2="990" y2="520"/>
    <line x1="1080" y1="60" x2="1080" y2="520"/>
    <line x1="1170" y1="60" x2="1170" y2="520"/>
  </g>
  <!-- Upper window bands -->
  <g fill="#a8bdd2" stroke="#9aa8b8" stroke-width="1.5">
    <rect x="360" y="90" width="220" height="70" rx="2"/>
    <rect x="600" y="90" width="220" height="70" rx="2"/>
    <rect x="840" y="90" width="220" height="70" rx="2"/>
    <rect x="1080" y="90" width="160" height="70" rx="2"/>
    <rect x="360" y="180" width="220" height="70" rx="2"/>
    <rect x="600" y="180" width="220" height="70" rx="2"/>
    <rect x="840" y="180" width="220" height="70" rx="2"/>
    <rect x="1080" y="180" width="160" height="70" rx="2"/>
    <rect x="360" y="270" width="220" height="70" rx="2"/>
    <rect x="600" y="270" width="220" height="70" rx="2"/>
    <rect x="840" y="270" width="220" height="70" rx="2"/>
    <rect x="1080" y="270" width="160" height="70" rx="2"/>
    <rect x="360" y="360" width="220" height="70" rx="2"/>
    <rect x="600" y="360" width="220" height="70" rx="2"/>
    <rect x="840" y="360" width="220" height="70" rx="2"/>
    <rect x="1080" y="360" width="160" height="70" rx="2"/>
  </g>
  <!-- Sky reflections in upper windows -->
  <g fill="#ffffff" opacity="0.35">
    <rect x="360" y="90" width="220" height="35" rx="2"/>
    <rect x="600" y="90" width="220" height="35" rx="2"/>
    <rect x="840" y="90" width="220" height="35" rx="2"/>
    <rect x="1080" y="90" width="160" height="35" rx="2"/>
    <rect x="360" y="180" width="220" height="35" rx="2"/>
    <rect x="840" y="180" width="220" height="35" rx="2"/>
    <rect x="600" y="270" width="220" height="35" rx="2"/>
    <rect x="1080" y="360" width="160" height="35" rx="2"/>
  </g>

  <!-- Entrance portal surround -->
  <rect x="500" y="480" width="600" height="360" fill="#e4dfd4"/>
  <rect x="508" y="488" width="584" height="344" fill="none" stroke="#b0aa9e" stroke-width="3"/>

  <!-- Canopy -->
  <rect x="470" y="470" width="660" height="22" rx="3" fill="url(#canopy)"/>
  <rect x="470" y="492" width="660" height="4" fill="#b8b2a6" opacity="0.7"/>
  <!-- Canopy light strip -->
  <rect x="500" y="494" width="600" height="3" fill="#f5efe2" opacity="0.9"/>

  <!-- Signage plaque -->
  <rect x="560" y="390" width="480" height="78" rx="4" fill="#ffffff" stroke="#b0aa9e" stroke-width="2"/>
  <ellipse cx="800" cy="429" rx="240" ry="50" fill="url(#signGlow)" filter="url(#soft)"/>
  <text x="800" y="428" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="52" font-weight="700" letter-spacing="18" fill="#1c1917">VERDALY</text>
  <text x="800" y="456" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="7" fill="#0f766e">TECHNOLOGIES · TRUST &amp; SAFETY</text>

  <!-- Soft ground shadow under canopy -->
  <ellipse cx="800" cy="840" rx="340" ry="50" fill="url(#spill)" filter="url(#glowBlur)"/>

  <!-- Glass curtain wall around doors -->
  <rect x="530" y="510" width="540" height="330" fill="url(#glass)"/>
  <!-- Curtain mullions -->
  <g stroke="url(#mullion)" stroke-width="3">
    <line x1="530" y1="510" x2="530" y2="840"/>
    <line x1="1070" y1="510" x2="1070" y2="840"/>
    <line x1="530" y1="510" x2="1070" y2="510"/>
    <line x1="665" y1="510" x2="665" y2="840"/>
    <line x1="935" y1="510" x2="935" y2="840"/>
    <line x1="530" y1="620" x2="665" y2="620"/>
    <line x1="935" y1="620" x2="1070" y2="620"/>
    <line x1="530" y1="730" x2="665" y2="730"/>
    <line x1="935" y1="730" x2="1070" y2="730"/>
  </g>

  <!-- Daylight reflections in side glass -->
  <path d="M540 520 L640 520 L560 830 L540 830 Z" fill="#ffffff" opacity="0.35"/>
  <path d="M960 520 L1060 520 L1060 830 L1040 830 Z" fill="#ffffff" opacity="0.3"/>

  <!-- Warm interior suggestion behind doors -->
  <rect x="675" y="530" width="250" height="310" fill="url(#doorGlow)" opacity="0.5" filter="url(#soft)"/>

  <!-- Double doors -->
  <rect x="680" y="530" width="115" height="310" rx="2" fill="url(#doorGlow)"/>
  <rect x="805" y="530" width="115" height="310" rx="2" fill="url(#doorGlow)"/>
  <!-- Door frames -->
  <rect x="680" y="530" width="115" height="310" rx="2" fill="none" stroke="#8a8478" stroke-width="3"/>
  <rect x="805" y="530" width="115" height="310" rx="2" fill="none" stroke="#8a8478" stroke-width="3"/>
  <!-- Center meeting stile -->
  <rect x="795" y="530" width="10" height="310" fill="#9a9488"/>
  <!-- Door glass panes (upper) -->
  <rect x="692" y="545" width="91" height="160" rx="1" fill="#c5d4e4" opacity="0.55"/>
  <rect x="817" y="545" width="91" height="160" rx="1" fill="#c5d4e4" opacity="0.55"/>
  <!-- Daylight reflection streaks on door glass -->
  <path d="M700 545 L740 545 L710 705 L692 705 Z" fill="#ffffff" opacity="0.4"/>
  <path d="M830 545 L870 545 L840 705 L817 705 Z" fill="#ffffff" opacity="0.35"/>
  <!-- Push bars -->
  <rect x="700" y="680" width="55" height="8" rx="4" fill="#7a7468"/>
  <rect x="845" y="680" width="55" height="8" rx="4" fill="#7a7468"/>
  <!-- Threshold -->
  <rect x="675" y="836" width="250" height="8" fill="#9a9488"/>

  <!-- Interior silhouette suggestion -->
  <g fill="#8a8478" opacity="0.3">
    <rect x="720" y="700" width="50" height="130" rx="4"/>
    <rect x="840" y="720" width="40" height="110" rx="4"/>
  </g>

  <!-- Pavement -->
  <rect x="0" y="840" width="1600" height="60" fill="url(#wet)"/>
  <!-- Soft pavement reflection of doors -->
  <rect x="675" y="840" width="250" height="60" fill="#ebe2cf" opacity="0.45"/>
  <rect x="720" y="840" width="60" height="60" fill="#f5efe2" opacity="0.35"/>
  <rect x="820" y="840" width="60" height="60" fill="#f5efe2" opacity="0.35"/>
  <!-- Pavement joints -->
  <g stroke="#a8a296" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="860" x2="1600" y2="860"/>
    <line x1="200" y1="840" x2="180" y2="900"/>
    <line x1="500" y1="840" x2="480" y2="900"/>
    <line x1="1100" y1="840" x2="1120" y2="900"/>
    <line x1="1400" y1="840" x2="1420" y2="900"/>
  </g>

  <!-- Bollards -->
  <g fill="#9a9488" stroke="#7a7468" stroke-width="1.5">
    <rect x="560" y="800" width="14" height="48" rx="7"/>
    <rect x="1026" y="800" width="14" height="48" rx="7"/>
    <rect x="480" y="810" width="12" height="42" rx="6"/>
    <rect x="1108" y="810" width="12" height="42" rx="6"/>
  </g>
  <!-- Bollard reflectors -->
  <rect x="562" y="812" width="10" height="4" rx="2" fill="#0f766e" opacity="0.7"/>
  <rect x="1028" y="812" width="10" height="4" rx="2" fill="#0f766e" opacity="0.7"/>
</svg>
